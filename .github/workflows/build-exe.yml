
name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build Windows EXE
        run: pyinstaller --onefile --windowed --name TB311FU-LineageOS-Installer installer.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TB311FU-LineageOS-Installer-Windows
          path: dist/TB311FU-LineageOS-Installer.exe
